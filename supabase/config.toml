# Supabase CLI configuration.
# Remote project: kvcnijyyfylxfarrlxkv
#
# This project's schema is versioned in supabase/migrations/. Every schema
# change must be a new migration file — do not paste DDL into the SQL editor.

project_id = "fantasyhub"

[db]
# Must match the remote Postgres major version so `supabase db diff` produces
# comparable output against a local shadow database.
major_version = 17

[db.migrations]
schema_paths = []

# The TD parlay's live tracker. Public, because the parlay board is public — a
# signed-out viewer's `functions.invoke` call must not be rejected for lack of a
# user JWT. The function reads only public data and writes only its own snapshot
# table (as the service role); there is nothing here to protect behind auth.
[functions.parlay-live]
verify_jwt = false
