name: CI

# §8.3: there was no CI. Lint, types, tests and migration validity are checked
# here on every PR so they stop being things someone remembers to run.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lint is advisory for now: the repo carries ~800 pre-existing errors from
      # before this refactor, so a hard gate would fail every PR on day one.
      # Drop `continue-on-error` once that backlog is worked off.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type-check
        run: npm run type-check

      - name: Tests
        run: npm run test:run

      - name: Build
        run: npm run build

      # The build succeeding says nothing about the bundle being loadable. A
      # circular static import between eager chunks exits 0 here and white-
      # screens in production, which is exactly what shipped on 2026-08-07.
      - name: Check the bundle is loadable
        run: npm run check-bundle

      # A missing Tailwind theme layer is invisible to every other gate above:
      # it type-checks, tests and builds clean, and only shows up as a
      # thousand small unstyled places in the browser. This is the check whose
      # absence let that ship.
      - name: Check the Tailwind theme layer reaches the bundle
        run: npm run check-css-tokens

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The replay below only means anything once the first migration actually
      # creates the schema. The project's original tables were built by hand in
      # the SQL editor, so migration 00000000000000 was a no-op marker and the
      # replay died on the first `alter table public.seasons` — there was no
      # seasons table to alter.
      #
      # Capturing that baseline needs the database password, so it cannot happen
      # here. Until it lands, skip rather than fail: a check that cannot pass is
      # worse than no check, and a red X on every PR trains people to ignore it.
      # The moment a real dump replaces the placeholder this becomes a live gate
      # with no further edits.
      - name: Is there a real baseline yet?
        id: baseline
        run: |
          if grep -qiE '^\s*create (table|schema|type)' supabase/migrations/00000000000000_*.sql; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Migration replay skipped::No baseline schema yet. Run 'supabase link --project-ref kvcnijyyfylxfarrlxkv' then 'supabase db dump -f supabase/migrations/00000000000000_baseline_schema.sql' and commit it; this job then gates every PR automatically."
          fi

      # Applies every migration to a throwaway local Postgres. Catches invalid
      # SQL and ordering mistakes without touching the production project, and
      # needs no secrets — which is why it is a separate job.
      #
      # Only the database container is started; the rest of the stack (studio,
      # realtime, storage, auth…) is irrelevant here and roughly triples the
      # startup time. Migrations are applied during startup, so a bad migration
      # fails this step.
      - name: Apply migrations to a throwaway database
        if: steps.baseline.outputs.ready == 'true'
        run: |
          supabase start \
            -x studio,realtime,storage-api,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      - name: Report drift between migrations and the applied schema
        if: steps.baseline.outputs.ready == 'true'
        run: supabase db diff --local

      - name: Tear down
        if: always() && steps.baseline.outputs.ready == 'true'
        run: supabase stop --no-backup
