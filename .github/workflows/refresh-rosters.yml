name: Refresh rosters

# The lineups the pick'ems research panel shows, kept current inside the
# pick'ems window.
#
# sync-week.yml runs once, Tuesday 04:00 ET, and writes `rosters` as one of its
# five steps. The pick'ems window runs Tuesday 04:00 to Thursday 20:00 — and
# waivers clear in the middle of it, on Wednesday. So for the back half of
# every window, the panel was describing a roster that predated the single
# biggest roster-churn event of the week, and the researcher was reading a
# lineup the manager had already changed.
#
# This runs only the roster step. It is not a second sync: scores, player
# stats, transactions and the ranking snapshot are all skipped, so it writes
# `rosters` and `players` and touches nothing the weekly job owns. The
# underlying write is delete-then-insert per team, so re-running is how you fix
# a failed run, same as everywhere else here.

on:
  schedule:
    # 13:00 UTC = 09:00 ET, after Wednesday waivers have processed and again on
    # Thursday, a few hours before the 20:00 ET pick'ems deadline.
    - cron: '0 13 * * 3,4'
  workflow_dispatch:

concurrency:
  # Shared with sync-week and sync-schedule. This does not write `games`, but
  # the weekly sync's own roster step writes exactly what this does, and two of
  # them interleaving would have one team's delete land inside another's
  # insert.
  group: espn-write
  cancel-in-progress: false

jobs:
  rosters:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Zero arguments, like the weekly job: the active season row supplies the
      # season, the week and the ESPN league. `reasonToSkip` exits 0 outside the
      # season, and the roster step skips itself once the playoffs start, so
      # this stays quiet for most of the year without a condition here.
      - name: Refresh rosters only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          node scripts/sync-week.js \
            --skip-scores \
            --skip-player-stats \
            --skip-transactions \
            --skip-snapshot \
            --manual
