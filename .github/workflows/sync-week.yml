name: Weekly ESPN sync

# Replaces the node-cron scheduler that ran inside the Express server (§7.1/§7.2).
# That server is gone, and it was never reliably running in the first place —
# railway.json and nixpacks.toml disagreed about the start command, so the
# scheduler may simply never have fired in production.
#
# The job takes no arguments: it resolves the active season and the current week
# from the database. Every step is an idempotent upsert against ESPN, so a
# failed run is fixed by re-running it — use the "Run workflow" button.
#
# Every run is a `workflow_dispatch`: a person's, or the Supabase cron's.

on:
  # No `schedule:` on purpose. GitHub's cron started this job four to five
  # hours late through September 2026, so Supabase's pg_cron keeps the clock
  # instead: at 10:00 UTC every Tuesday (05:00 EST / 06:00 EDT — the hour that
  # is never earlier than 05:00 ET, a buffer for the Tuesdays ESPN clears a
  # late waiver run after Monday night football) it dispatches this workflow
  # with `trigger: cron`. That is also when the week's pick'em row is created
  # (the `pickEmWeek` step), so nobody has to open it by hand. See
  # supabase/migrations/20260929120000_cron_dispatch_workflows.sql.
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to sync (blank = current week of the active season)'
        required: false
        type: string
      dry_run:
        description: 'Resolve the target and write nothing'
        required: false
        default: false
        type: boolean
      trigger:
        description: 'Who started this run. The Supabase cron sends "cron"; leave it on "manual".'
        required: false
        default: manual
        type: choice
        options: [manual, cron]

concurrency:
  # Two syncs writing the same week's scores would race, and so would a schedule
  # import running at the same time. One group for everything that writes games.
  group: espn-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync the week
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          node scripts/sync-week.js \
            ${{ inputs.week }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            ${{ inputs.trigger != 'cron' && '--manual' || '' }}
