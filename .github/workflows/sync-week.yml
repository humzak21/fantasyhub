name: Weekly ESPN sync

# Replaces the node-cron scheduler that ran inside the Express server (§7.1/§7.2).
# That server is gone, and it was never reliably running in the first place —
# railway.json and nixpacks.toml disagreed about the start command, so the
# scheduler may simply never have fired in production.
#
# The job takes no arguments: it resolves the active season and the current week
# from the database. Every step is an idempotent upsert against ESPN, so a
# failed run is fixed by re-running it — use the "Run workflow" button.

on:
  schedule:
    # 10:00 UTC Tuesday = 05:00 EST / 06:00 EDT. Cron here is always UTC;
    # GitHub does not do zones, so this is the hour that is never *earlier*
    # than 05:00 ET across the season — the buffer exists for the Tuesdays
    # when ESPN clears a late waiver run after Monday night football, and it
    # is also when the week's pick'em row is created (the `pickEmWeek` step),
    # so nobody has to open it by hand.
    - cron: '0 10 * * 2'
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to sync (blank = current week of the active season)'
        required: false
        type: string
      dry_run:
        description: 'Resolve the target and write nothing'
        required: false
        default: false
        type: boolean

concurrency:
  # Two syncs writing the same week's scores would race, and so would a schedule
  # import running at the same time. One group for everything that writes games.
  group: espn-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync the week
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          node scripts/sync-week.js \
            ${{ inputs.week }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}
